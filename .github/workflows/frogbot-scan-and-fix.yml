# This workflow uses actions that are not certified by GitHub.
# Frogbot scans dependencies with JFrog Xray and can open fix pull requests.
# Configure JF_URL and JF_ACCESS_TOKEN repository secrets to enable it.

name: "Frogbot Scan and Fix"
on:
  push:
    branches: [ "main" ]
permissions:
  contents: write
  pull-requests: write
  security-events: write
jobs:
  create-fix-pull-requests:
    runs-on: ubuntu-latest
    env:
      JF_URL: ${{ secrets.JF_URL }}
      JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
      JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan and create dependency fix pull requests
        if: ${{ env.JF_URL != '' && env.JF_ACCESS_TOKEN != '' }}
        uses: jfrog/frogbot@5d9c42c30f1169d8be4ba5510b40e75ffcbbc2a9 # v2.21.2
