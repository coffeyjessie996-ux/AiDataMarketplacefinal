name: Stripe checkout security contracts

on:
  push:
    branches:
      - test/stripe-checkout-security-contracts
  pull_request:
    branches:
      - main
    paths:
      - apps/api/src/index.ts
      - apps/api/test/stripe-checkout-security.test.mjs
      - .github/workflows/stripe-checkout-contract-tests.yml

permissions:
  contents: read

jobs:
  checkout-contracts:
    name: Node ${{ matrix.node-version }} contract tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Stripe checkout security contracts
        working-directory: apps/api
        run: node --test test/*.test.mjs
