name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: pnpm

    - name: Install
      run: pnpm install --frozen-lockfile

    - name: Build API
      run: pnpm --filter @ai-data-marketplace/api run vercel-build

    - name: Build web
      run: pnpm --filter @ai-data-marketplace/web run build
    
    - name: AI Auto Code Review
      uses: iandis/ai-code-review@v1.0.1
  
