name: Scheduled supplier research agents

on:
  schedule:
    # Vercel Hobby handles one daily run; GitHub Actions supplies the other three.
    - cron: '0 6,12,18 * * *'
    - cron: '15 6,12,18 * * *'
    # The daily Vercel run is at 00:30 UTC; this adds the second AI run 12 hours later.
    - cron: '30 12 * * *'

permissions:
  contents: read

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository Actions secret CRON_SECRET is missing. Add the same value configured for the Vercel project."
            exit 1
          fi

      - name: Run USAspending collector
        if: github.event.schedule == '0 6,12,18 * * *'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://aidatamarketplacefinal.vercel.app/api/cron/research/federal-awards"

      - name: Run SAM.gov collector
        if: github.event.schedule == '15 6,12,18 * * *'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://aidatamarketplacefinal.vercel.app/api/cron/research/sam-opportunities"

      - name: Run OpenAI research analyst
        if: github.event.schedule == '30 12 * * *'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://aidatamarketplacefinal.vercel.app/api/cron/ai/research-enrichment"
